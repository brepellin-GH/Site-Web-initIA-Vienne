[build]
  command = "corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/initia-vienne run build"
  publish = "artifacts/initia-vienne/dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  BASE_PATH = "/"

[functions]
  [functions."send-newsletter"]
    timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
