kind = "web"
previewPath = "/"
title = "initIA Vienne"
version = "1.0.0"
id = "artifacts/initia-vienne"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19355

[services.development]
run = "pnpm --filter @workspace/initia-vienne run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/initia-vienne", "run", "build" ]
publicDir = "artifacts/initia-vienne/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19355"
BASE_PATH = "/"
